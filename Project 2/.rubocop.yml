plugins:
  - rubocop-minitest
  - rubocop-rake

AllCops:
  TargetRubyVersion: 3.4
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "build/**/*"
    - "coverage/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# The renderer and the views compute screen positions; short methods would
# hide the layout arithmetic.
Metrics/MethodLength:
  Max: 25
Metrics/AbcSize:
  Max: 30
  Exclude:
    - "lib/ali/tui/diagram.rb"
    - "lib/ali/tui/screen.rb"
    - "lib/ali/tui/other_screens.rb"
Metrics/CyclomaticComplexity:
  Max: 10
Metrics/PerceivedComplexity:
  Max: 10
Metrics/ClassLength:
  Max: 250
Metrics/ParameterLists:
  CountKeywordArgs: false

Metrics/BlockLength:
  Exclude:
    - "test/**/*"

Style/Documentation:
  Exclude:
    - "test/**/*"

# One-letter names are clear in short blocks, for example |a, b|.
Naming/MethodParameterName:
  AllowedNames: [x, y, w, h, a, b, z, v, op, to]
